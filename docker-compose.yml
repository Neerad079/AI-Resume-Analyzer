services:
  mysql:
    image: mysql:8.0
    container_name: hireiq-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: hireiq
    ports:
      - "3308:3306"   # Maps to 3308 on host since 3306 and 3307 are already in use
    volumes:
      - hireiq_mysql_data:/var/lib/mysql
    networks:
      - hireiq-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: hireiq-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hireiq?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - backend_logs:/app/logs
    networks:
      - hireiq-network
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: hireiq-frontend
    ports:
      - "5173:80"         # Access the app at http://localhost:5173
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
      CORS_ORIGINS: ${CORS_ORIGINS}
    networks:
      - hireiq-network
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hireiq_mysql_data:
  backend_logs:

networks:
  hireiq-network:
    driver: bridge
