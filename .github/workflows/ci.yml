name: HireIQ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build frontend for production
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080/api

  backend:
    name: Backend (Test & Package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x ./mvnw

      - name: Run backend unit and integration tests
        run: ./mvnw test -B
        env:
          JWT_SECRET: ci-test-jwt-secret-key-at-least-256-bits-long-for-testing-purposes
          SPRING_DATASOURCE_URL: jdbc:h2:mem:hireiq_test;DB_CLOSE_DELAY=-1;MODE=MySQL

      - name: Package production JAR
        run: ./mvnw package -DskipTests -B
